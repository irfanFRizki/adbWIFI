name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        required: false
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  build-server:
    name: Build Server APK (HP Target)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        shell: bash

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-server-${{ hashFiles('server-app/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-server-

      # ── Tentukan versi server dari tag (lini 2.0.x) ──
      - name: Tentukan versi server
        id: srv_ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            PATCH="${TAG_VER##*.}"
          else
            PATCH="0"
          fi
          if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then PATCH=0; fi
          VERSION_NAME="2.0.${PATCH}"
          VERSION_CODE=$((2000000 + 10#${PATCH}))
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Tanam versi ke server build.gradle
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.srv_ver.outputs.version_code }}/" server-app/app/build.gradle
          sed -i "s/versionName '2.0.0'/versionName '${{ steps.srv_ver.outputs.version_name }}'/" server-app/app/build.gradle
          grep -E "version(Code|Name)" server-app/app/build.gradle

      - name: Build Server Release APK
        run: gradle assembleRelease
        working-directory: ${{ github.workspace }}/server-app

      - name: Get server version
        id: server_version
        run: |
          VERSION="${{ steps.srv_ver.outputs.version_name }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename Server APK
        run: |
          APK_PATH="server-app/app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="TelemetryServer-v${{ steps.server_version.outputs.version }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Server APK
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryServer-APK
          path: TelemetryServer-v*.apk
          retention-days: 30

  build-dashboard:
    name: Build Dashboard APK (HP Pantau)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        shell: bash

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-dashboard-${{ hashFiles('dashboard-app/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-dashboard-

      # ── Tentukan versionName & versionCode dari git tag (sama seperti kalender-PL) ──
      - name: Tentukan versionName & versionCode
        id: dash_ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ "${VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_CODE=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          else
            VERSION_CODE=$((100000000 + GITHUB_RUN_NUMBER))
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      # ── Tanam versi ke web assets (version.js, update-checker.js) SEBELUM build ──
      - name: Tanam versi ke dashboard web assets
        run: |
          sed -i "s/__APP_VERSION__/${{ steps.dash_ver.outputs.version_name }}/" dashboard-app/www/version.js
          sed -i "s/__APP_VERSION__/${{ steps.dash_ver.outputs.version_name }}/" dashboard-app/www/update-checker.js

      # ── Update versionName & versionCode di build.gradle ──
      - name: Update build.gradle version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.dash_ver.outputs.version_code }}/" dashboard-app/android/app/build.gradle
          sed -i "s/versionName \"2.0.0\"/versionName \"${{ steps.dash_ver.outputs.version_name }}\"/" dashboard-app/android/app/build.gradle

      - name: Build Dashboard Release APK
        run: gradle assembleRelease
        working-directory: ${{ github.workspace }}/dashboard-app/android

      - name: Get dashboard version
        id: dash_version
        run: |
          VERSION="${{ steps.dash_ver.outputs.version_name }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename Dashboard APK
        run: |
          APK_PATH="dashboard-app/android/app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="TelemetryDashboard-v${{ steps.dash_version.outputs.version }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryDashboard-APK
          path: TelemetryDashboard-v*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-server, build-dashboard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Server APK
        uses: actions/download-artifact@v4
        with:
          name: TelemetryServer-APK
          path: ./artifacts/server

      - name: Download Dashboard APK
        uses: actions/download-artifact@v4
        with:
          name: TelemetryDashboard-APK
          path: ./artifacts/dashboard

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/server/TelemetryServer-v*.apk
            ./artifacts/dashboard/TelemetryDashboard-v*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}