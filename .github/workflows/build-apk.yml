name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        required: false
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

jobs:
  build-server:
    name: Build Server APK (HP Target)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        shell: bash

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-server-${{ hashFiles('server-app/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-server-

      - name: Build Server Release APK
        run: gradle assembleRelease
        working-directory: ${{ github.workspace }}/server-app

      - name: Get server version
        id: server_version
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" server-app/app/build.gradle | head -1)
          echo "version=${VERSION:-2.0.0}" >> $GITHUB_OUTPUT

      - name: Rename Server APK
        run: |
          APK_PATH="server-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          NEW_NAME="TelemetryServer-v${{ steps.server_version.outputs.version }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Server APK
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryServer-APK
          path: TelemetryServer-v*.apk
          retention-days: 30

  build-dashboard:
    name: Build Dashboard APK (HP Pantau)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        shell: bash

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-dashboard-${{ hashFiles('dashboard-app/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-dashboard-

      - name: Build Dashboard Release APK
        run: gradle assembleRelease
        working-directory: ${{ github.workspace }}/dashboard-app/android

      - name: Get dashboard version
        id: dash_version
        run: |
          VERSION=$(grep -oP "versionName\s+'\K[^']+" dashboard-app/android/app/build.gradle | head -1)
          echo "version=${VERSION:-2.0.0}" >> $GITHUB_OUTPUT

      - name: Rename Dashboard APK
        run: |
          APK_PATH="dashboard-app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          NEW_NAME="TelemetryDashboard-v${{ steps.dash_version.outputs.version }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryDashboard-APK
          path: TelemetryDashboard-v*.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-server, build-dashboard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Server APK
        uses: actions/download-artifact@v4
        with:
          name: TelemetryServer-APK
          path: ./artifacts/server

      - name: Download Dashboard APK
        uses: actions/download-artifact@v4
        with:
          name: TelemetryDashboard-APK
          path: ./artifacts/dashboard

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/server/TelemetryServer-v*.apk
            ./artifacts/dashboard/TelemetryDashboard-v*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}